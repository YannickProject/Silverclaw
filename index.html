<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silverclaw Outreach Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 750px;
        }
        .card {
            background-color: #2b2b2b;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #444;
            margin-bottom: 25px;
        }
        h2, h3 {
            margin-top: 0;
            color: #e0e0e0;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #121212;
            color: #fff;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }
        .btn-random {
            background-color: #4a90e2;
            color: white;
            flex: 1;
        }
        .btn-random:hover { background-color: #357abd; }
        
        .btn-import {
            background-color: #5cb85c;
            color: white;
            width: 100%;
            margin-top: 8px;
        }
        .btn-import:hover { background-color: #4cae4c; }

        .btn-send {
            background-color: #d9534f;
            color: white;
            width: 100%;
            margin-top: 20px;
        }
        .btn-send:hover { background-color: #c9302c; }

        .btn-clear {
            background-color: #555;
            color: white;
            font-size: 12px;
            padding: 5px 10px;
            float: right;
        }
        .btn-clear:hover { background-color: #777; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: #121212;
            border-radius: 5px;
            overflow: hidden;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }
        th {
            background-color: #222;
            color: #aaa;
        }
        .status-select {
            padding: 5px;
            font-size: 12px;
            background-color: #222;
        }
        .delete-btn {
            background-color: transparent;
            color: #d9534f;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .counter {
            font-size: 13px;
            color: #4a90e2;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- IMPORTEER CARD -->
    <div class="card">
        <h2>📥 Importeer Spelers (Zonder Familie)</h2>
        <label for="lijstInvoer">Plak hier de gekopieerde lijst van Mafiaway (list.php?s=fam):</label>
        <textarea id="lijstInvoer" rows="2" placeholder='Plak hier de lijst uit Tampermonkey...'></textarea>
        <button class="btn-import" onclick="importeerLijst()">📥 Importeer Lijst</button>
        <span class="counter" id="lijstTeller">Geladen spelers zonder familie: 0</span>
    </div>

    <!-- BERICHT VERSTUREN CARD -->
    <div class="card">
        <h2>🐺 SILVERCLAW OUTREACH</h2>
        
        <label for="speler">Spelernaam</label>
        <input type="text" id="speler" placeholder="Voer naam in of kies willekeurig">
        
        <div class="btn-group">
            <button class="btn-random" onclick="kiesRandomSpeler()">🎲 Kies Random Familieloze Speler</button>
        </div>
        
        <label for="onderwerp">Onderwerp</label>
        <input type="text" id="onderwerp" value="Silverclaw zoekt jou!">
        
        <label for="bericht">Bericht (gebruik {speler} voor de naam)</label>
        <textarea id="bericht" rows="5">Hey [speler]{speler}[/speler],

Sluit je aan bij familie Silverclaw!</textarea>
        
        <button class="btn-send" onclick="stuurBericht()">🚀 STUUR BERICHT & SLA OP IN LOGBOEK</button>
    </div>

    <!-- LOGBOEK CARD -->
    <div class="card">
        <button class="btn-clear" onclick="wisLogboek()">Wis Logboek</button>
        <h3>📋 Verzondengeschiedenis</h3>
        
        <table>
            <thead>
                <tr>
                    <th>Speler</th>
                    <th>Datum / Tijd</th>
                    <th>Status</th>
                    <th>Actie</th>
                </tr>
            </thead>
            <tbody id="logboekBody"></tbody>
        </table>
    </div>
</div>

<script>
let spelersLijst = JSON.parse(localStorage.getItem('silverclaw_vrije_spelers')) || [];

function updateTeller() {
    document.getElementById('lijstTeller').innerText = `Geladen spelers zonder familie: ${spelersLijst.length}`;
}

function importeerLijst() {
    const invoer = document.getElementById('lijstInvoer').value.trim();
    try {
        const gelezenLijst = JSON.parse(invoer);
        if (Array.isArray(gelezenLijst)) {
            spelersLijst = gelezenLijst;
            localStorage.setItem('silverclaw_vrije_spelers', JSON.stringify(spelersLijst));
            updateTeller();
            alert(`${spelersLijst.length} familieloze spelers succesvol geïmporteerd!`);
            document.getElementById('lijstInvoer').value = '';
        } else {
            alert("Ongeldig formaat. Gebruik de rode knop op Mafiaway.");
        }
    } catch(e) {
        alert("Fout bij het lezen. Zorg dat je de gekopieerde tekst van de rode knop op Mafiaway plakt.");
    }
}

function kiesRandomSpeler() {
    if (spelersLijst.length === 0) {
        alert("Geen familieloze spelers geladen!\n\n1. Ga op Mafiaway naar list.php?s=fam\n2. Klik op de rode knop rechtsboven\n3. Plak die tekst hierboven bij 'Importeer Spelers'.");
        return;
    }
    
    const logboek = haalLogboekOp();
    const reedsBenaderd = logboek.map(item => item.speler.toLowerCase());
    const nogNietBenaderd = spelersLijst.filter(speler => !reedsBenaderd.includes(speler.toLowerCase()));

    if (nogNietBenaderd.length === 0) {
        alert("Alle spelers uit je familieloze lijst zijn al aangeschreven!");
        return;
    }

    const willekeurigeIndex = Math.floor(Math.random() * nogNietBenaderd.length);
    document.getElementById('speler').value = nogNietBenaderd[willekeurigeIndex];
}

function stuurBericht() {
    const speler = document.getElementById('speler').value.trim();
    const onderwerp = document.getElementById('onderwerp').value;
    let bericht = document.getElementById('bericht').value;
    
    if (!speler) {
        alert("Vul een spelernaam in!");
        return;
    }

    bericht = bericht.replace(/{speler}/g, speler);
    voegToeAanLogboek(speler);

    const mafiawayUrl = `https://www.mafiaway.nl/message.php?p=new` +
        `&to=${encodeURIComponent(speler)}` +
        `&subject=${encodeURIComponent(onderwerp)}` +
        `&msg=${encodeURIComponent(bericht)}`;

    window.open(mafiawayUrl, '_blank');
}

function haalLogboekOp() {
    return JSON.parse(localStorage.getItem('silverclaw_logboek')) || [];
}

function SlaLogboekOp(data) {
    localStorage.setItem('silverclaw_logboek', JSON.stringify(data));
}

function voegToeAanLogboek(speler) {
    const logboek = haalLogboekOp();
    const datum = new Date().toLocaleString('nl-NL', { dateStyle: 'short', timeStyle: 'short' });
    
    logboek.unshift({
        id: Date.now(),
        speler: speler,
        datum: datum,
        status: '⏳ Wacht op reactie'
    });

    SlaLogboekOp(logboek);
    laadLogboekTabel();
}

function updateStatus(id, nieuweStatus) {
    const logboek = haalLogboekOp();
    const item = logboek.find(entry => entry.id === id);
    if (item) {
        item.status = nieuweStatus;
        SlaLogboekOp(logboek);
    }
}

function verwijderItem(id) {
    let logboek = haalLogboekOp();
    logboek = logboek.filter(entry => entry.id !== id);
    SlaLogboekOp(logboek);
    laadLogboekTabel();
}

function wisLogboek() {
    if (confirm("Weet je zeker dat je de hele verzendgeschiedenis wilt wissen?")) {
        localStorage.removeItem('silverclaw_logboek');
        laadLogboekTabel();
    }
}

function laadLogboekTabel() {
    const logboek = haalLogboekOp();
    const tbody = document.getElementById('logboekBody');
    tbody.innerHTML = '';

    if (logboek.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#777;">Nog geen berichten verzonden.</td></tr>';
        return;
    }

    logboek.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><strong>${item.speler}</strong></td>
            <td>${item.datum}</td>
            <td>
                <select class="status-select" onchange="updateStatus(${item.id}, this.value)">
                    <option value="⏳ Wacht op reactie" ${item.status === '⏳ Wacht op reactie' ? 'selected' : ''}>⏳ Wacht op reactie</option>
                    <option value="✅ Gereageerd" ${item.status === '✅ Gereageerd' ? 'selected' : ''}>✅ Gereageerd</option>
                    <option value="❌ Geen interesse" ${item.status === '❌ Geen interesse' ? 'selected' : ''}>❌ Geen interesse</option>
                    <option value="🤝 Lid geworden" ${item.status === '🤝 Lid geworden' ? 'selected' : ''}>🤝 Lid geworden</option>
                </select>
            </td>
            <td>
                <button class="delete-btn" onclick="verwijderItem(${item.id})">❌</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// Opstarten
updateTeller();
laadLogboekTabel();
</script>

</body>
</html>
