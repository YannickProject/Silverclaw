<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silverclaw Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #2b2b2b;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 350px;
            border: 1px solid #444;
        }
        h2 {
            margin-top: 0;
            color: #e0e0e0;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #121212;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🐺 SILVERCLAW</h2>
    
    <label for="speler">Spelernaam</label>
    <input type="text" id="speler" placeholder="Bijv. raymondlion" value="raymondlion">
    
    <label for="onderwerp">Onderwerp</label>
    <input type="text" id="onderwerp" value="Hey, kom je bij ons?">
    
    <label for="bericht">Bericht</label>
    <textarea id="bericht" rows="4">[b]Hey [speler]@@speler[/speler][/b],
 
[b][fam]Silverclaw[/fam][/b] is op zoek naar nieuwe leden, ik denk dat jij hier perfect bij past!

[size=4][b]Waarom [b][fam]Silverclaw[/fam][/b]?[/size]
[i][b]Geen verplichte donaties dus je bepaald zelf wat je met je geld doet.[/b][/i]
[i]Een gezellige groep leden, met jou erbij nog leuker![/i]
[i]We spelen met elkaar en [b]we spelen voor het plezier samen.[/b][/i]

[size=4][b]Wat we zoeken in een nieuwe wolf:[/b][/size]
 
[i]Iemand die wel lid wilt worden van onze discord server voor gezelligheid & communicatie.[/i]
[i]Iemand die ervoor open staat om nieuwe dingen te leren op Mafiaway.[/i]
[i]Iemand die respect heeft voor elke speler.[/i]

[size=4][b]Wat basisregels:[/b][/size]
 
[i]Kills vanaf Soldier of Obay-kogelwaarde + 15% vanaf 100.000 kogels.[/i]
[i]Discord = verplicht voor de gezelligheid & communicatie.[/i]
[i]Respect voor andere spelers.[/i]
[i]Plezier maken, met elkaar en voor elkaar.[/i]

[b]Heb jij net als mij het gevoel dat je hier goed bij past?[/b]

Meld je dan nu aan bij [b][fam]Silverclaw[/fam][/b]. En laat het mij even weten zodat ik je onze discord link kan toesturen!</textarea>
    
    <button onclick="stuurBericht()">🚀 STUUR BERICHT</button>
</div>

<script>
function stuurBericht() {
    const speler = document.getElementById('speler').value;
    const onderwerp = document.getElementById('onderwerp').value;
    const bericht = document.getElementById('bericht').value;
    
    if (!speler) {
        alert("Vul een spelernaam in!");
        return;
    }

    const mafiawayUrl = `https://www.mafiaway.nl/message.php?p=new` +
        `&to=${encodeURIComponent(speler)}` +
        `&subject=${encodeURIComponent(onderwerp)}` +
        `&msg=${encodeURIComponent(bericht)}`;

    window.open(mafiawayUrl, '_blank');
}
</script>

</body>
</html>
